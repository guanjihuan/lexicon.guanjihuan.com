<!DOCTYPE html>
<!-- 对比度实测夹具：把「压在饱和底色上的文字」代表元素各造一个，
     供 tools/contrast_test.py 在明暗两套主题下量测 WCAG 对比度。
     只测样式，不含任何数据。 -->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<nav class="mainnav">
  <a class="nav-item active"><span class="ni"></span><span>词库</span></a>
</nav>
<div class="topbar-right"><span class="visit-pill">7</span></div>
<div class="hero"><a class="btn primary">开始复习</a></div>
<div class="btn-group"><button class="on">表格</button><button>卡片</button></div>
<div>
  <span class="chip on">核心</span>
  <button class="letter-btn on">A</button>
  <div class="pager"><button class="on">1</button></div>
</div>
<div class="seg"><button class="on">跟随系统</button></div>
<a class="skip-link" href="#main">跳到主要内容</a>
<button class="btn primary">保存</button>
<button class="btn good">认识</button>
<button class="btn warn">模糊</button>
<button class="btn bad">忘了</button>
<div class="fc-btns">
  <button class="btn good">认识<small>1 天</small></button>
  <button class="btn warn">模糊<small>6 天</small></button>
  <button class="btn bad">忘了<small>重学</small></button>
</div>
<div class="fcss-item good">很好</div>
<div class="fcss-item mid">一般</div>
<div class="fcss-item bad">不佳</div>
<div class="danger-zone danger-zone-strong">
  <div class="l">清空全部数据</div>
  <div class="d">此操作不可撤销</div>
  <button class="btn bad">清空</button>
</div>
<div class="page-sub">次级说明文字</div>
<div class="faint">弱化说明文字</div>
<a class="btn danger-outline">危险操作</a>
<table class="word-table"><thead><tr><th>序号</th></tr></thead></table>
<!-- 第三十九轮新增：品牌图标、测验对错序号、快捷入口图标（悬停态）、筛选计数徽标（窄屏态） -->
<div class="brand"><span class="brand-logo">字</span></div>
<div class="quiz-opts">
  <button class="quiz-opt correct"><span class="oi">A</span>正确选项</button>
  <button class="quiz-opt wrong"><span class="oi">B</span>错误选项</button>
</div>
<a class="quick-btn" href="#"><span class="qb">图</span>浏览全库</a>
<div class="filter-bar">
  <button class="btn sm filter-toggle">筛选 <span class="ft-count">3</span></button>
</div>
</body>
</html>
