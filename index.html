/* 首屏定主题：默认深色（dark2026），在样式生效前就把 data-theme 写到 <html> 上
   —— 否则深色用户会先闪一帧浅色。
   主题只有「浅色 / 深色」两档，不再跟随系统：旧存档里的「跟随系统」(auto)
   一律落到深色（默认深色）。 */
(function () {
  var KEY = 'wl_state_v1';
  var raw = null, st = null, t = 'dark';
  try { raw = localStorage.getItem(KEY) || localStorage.getItem('wl_state'); } catch (e) { /* 忽略 */ }
  if (raw) { try { st = JSON.parse(raw); } catch (e) { st = null; } }
  if (st && st.settings) t = st.settings.theme || 'dark';
  if (t !== 'light') t = 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
